name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.apk.outputs.sha256 }}
      commit: ${{ steps.apk.outputs.commit }}
      message: ${{ steps.apk.outputs.message }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$VERSION\"" app/build.gradle.kts \
            || { echo "::error::versionName in app/build.gradle.kts is not $VERSION"; exit 1; }
          grep -rq "const val VERSION = \"$VERSION\"" app/src/main/java \
            || { echo "::error::VERSION in Settings.kt is not $VERSION"; exit 1; }

      - name: Build the same image used locally
        run: docker build -t android -f docker/Dockerfile .

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e HOME=/tmp \
            -e GRADLE_USER_HOME=/workspace/.gradle \
            -e GITHUB_SHA \
            -e KEYSTORE_FILE=/workspace/release.jks \
            -e KEYSTORE_PASSWORD \
            -e KEY_ALIAS \
            -e KEY_PASSWORD \
            android ./gradlew --no-daemon assembleRelease
          rm release.jks

      - name: Publish GitHub release
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="btc-wallet-${GITHUB_REF_NAME#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          # checkout flattens annotated tags, fetch the real one for its message
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          MESSAGE="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --notes "$MESSAGE"
          echo "sha256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

  page:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update download page
        env:
          SHA256: ${{ needs.release.outputs.sha256 }}
          COMMIT: ${{ needs.release.outputs.commit }}
          MESSAGE: ${{ needs.release.outputs.message }}
        run: python3 .github/scripts/update-page.py

      - name: Commit page and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs(site): publish $GITHUB_REF_NAME"
          git push origin main
          gh workflow run pages.yml --ref main
